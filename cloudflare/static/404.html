<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halaman tidak dijumpai</title>
<style>
  html{ background:#620909; }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    display:grid; place-items:center; padding:2rem;
    font-family:Georgia, 'Times New Roman', serif;
    color:#fffaf3; text-align:center;
    background:radial-gradient(ellipse 90% 60% at 50% 38%, #7a1414, #470606);
  }
  p{ margin:.4rem 0; letter-spacing:.04em; }
  .big{ font-size:2.2rem; letter-spacing:.12em; }
  a{
    display:inline-block; margin-top:1.4rem; padding:.8rem 1.6rem;
    border:1px solid rgba(255,250,243,.8); color:#fffaf3;
    text-decoration:none; letter-spacing:.14em; text-transform:uppercase; font-size:.8rem;
  }
</style>
</head>
<body>
<main>
  <p class="big">404</p>
  <p>Halaman ini tidak dijumpai.</p>
  <a href="/">Kembali ke jemputan</a>
</main>
</body>
</html>
